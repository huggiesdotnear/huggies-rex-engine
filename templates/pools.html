{% extends "base.html" %}
{% block title %}POOLS — HUGGIES REX{% endblock %}
{% block content %}
  <section class="huggies_rex_card">
    <h1>POOLS <small id="pools-shown"></small></h1>
    <input class="huggies_rex_input" id="pools-search" placeholder="search pool id or token">
    <table class="huggies_rex_table">
      <thead>
        <tr><th>#</th><th>kind</th><th>tokens</th><th>fee</th></tr>
      </thead>
      <tbody id="pools-body"></tbody>
    </table>
    <small>showing up to 500 matching pools.</small>
  </section>
  <script src="/static/js/pools.js"></script>
{% endblock %}
