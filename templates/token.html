{% extends "base.html" %}
{% block title %}TOKEN — HUGGIES REX{% endblock %}
{% block content %}
  <section class="huggies_rex_card">
    <h1 id="token-symbol">…</h1>
    <p>account id: <code id="token-account">…</code></p>
    <p>decimals: <span id="token-decimals">…</span></p>
    <p>price (usd): <span id="token-price">…</span></p>
  </section>
  <section class="huggies_rex_card">
    <h2>pools containing this token (<span id="token-pools-count">…</span>)</h2>
    <table class="huggies_rex_table">
      <thead><tr><th>#</th><th>kind</th><th>paired with</th><th>fee</th><th>reserves</th></tr></thead>
      <tbody id="token-pools-body"></tbody>
    </table>
  </section>
  <script>
    const TOKEN_ID = {{ token_id|json }};
  </script>
  <script src="/static/js/token.js"></script>
{% endblock %}
