{% extends "base.html" %}
{% block title %}SWAP — HUGGIES REX{% endblock %}
{% block content %}
  <section class="huggies_rex_card">
    <h2>swap</h2>
    <label>token in</label>
    <input class="huggies_rex_input" id="swap-token-in" list="swap-token-list" placeholder="search token or paste account id">
    <label>amount in (human, e.g. <code>5</code> for 5 NEAR)</label>
    <input class="huggies_rex_input" id="swap-amount-in" placeholder="0.0">
    <label>token out</label>
    <input class="huggies_rex_input" id="swap-token-out" list="swap-token-list" placeholder="search token or paste account id">
    <p>best return: <span id="swap-amount-out">—</span></p>
    <button class="huggies_rex_button" id="swap-quote">GET QUOTES</button>
    <p><small>phase one is read-only — no transactions are submitted.</small></p>
    <div id="swap-routes"></div>
  </section>
  <datalist id="swap-token-list"></datalist>
  <script src="/static/js/swap.js"></script>
{% endblock %}
