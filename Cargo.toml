[package]
name = "shit-1170-rex-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
dotenvy = "0.15.7"
futures-util = "0.3.34"
hex = "0.4.3"
local-ip-address = "0.6.13"
near-kit = { version = "0.30.0-rc.3", default-features = false, features = ["rpc"] }
rand = "0.10.3"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "macros", "json", "derive"] }
tokio = { version = "1.40", features = ["full"] }
tower-http = { version = "0.7.1", features = ["fs", "cors"] }
uuid = { version = "1.28.0", features = ["v4"] }

[dev-dependencies]
# a real websocket CLIENT, so the socket is tested the way a browser
# talks to it. it is a dev dependency and not a runtime one: the server
# only ever serves the socket, it never dials one.
tokio-tungstenite = "0.29.0"
