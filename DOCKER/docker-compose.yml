# docker-compose.yml — single-service backend.
#
# run from the repo root:
#   docker compose -f DOCKER/docker-compose.yml up -d --build
#   docker compose -f DOCKER/docker-compose.yml logs -f
#   docker compose -f DOCKER/docker-compose.yml down
#
# there is no persistent state yet: the `static/` frontend bundle is
# baked into the image, and the frontend talks to the intear api
# directly from the browser (the backend is never rate limited by
# it). so there is no vault / db volume to mount here yet.

name: huggies-rex-engine-fullstack-backend
services:
  huggies-backend:
    build:
      context: ..
      dockerfile: DOCKER/Dockerfile
    image: huggies/huggies-rex-engine:0.1.0
    container_name: huggies-rex-engine-fullstack-backend
    restart: unless-stopped

    ports:
      # host:container. the container listens on 54733 (HUGGIES_PORT);
      # change the left side to move the host port, but keep the right
      # side in sync with HUGGIES_PORT below.
      - "54733:54733"

    environment:
      # must be 0.0.0.0 inside a container so the published port is
      # actually reachable from the host.
      HUGGIES_HOST: "0.0.0.0"
      HUGGIES_PORT: "54733"
      RUST_LOG: "huggies_rex_engine=info"

# ========================================
# NOTE: wallet sign-in needs a SECURE CONTEXT.
#
# the reason: signing a login message uses WebCrypto Ed25519, and
# `crypto.subtle` is only exposed in a secure context. browsers
# treat https, http://localhost and http://127.0.0.1 as secure —
# nothing else. so `http://localhost:54733` signs in fine, while
# the same container reached by LAN ip, VPN ip or hostname over
# plain http fails with "Cannot read properties of undefined
# (reading 'generateKey')".
#
# the fix is to terminate TLS in front of this container, on the
# hostname you actually open the app from. that proxy does not need
# to live in this file or in the image.
# ========================================

