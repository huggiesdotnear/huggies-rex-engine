# docker-compose.yml — backend + cloudflare tunnel.
#
# run from the repo root:
#   docker compose -f DOCKER/docker-compose.yml up -d --build
#   docker compose -f DOCKER/docker-compose.yml logs -f
#   docker compose -f DOCKER/docker-compose.yml down
#
# there IS persistent state: the sqlite db. it lives in the named volume
# `shit-1170-rex-engine-production-vault`, mounted at the app's default
# vault path. the `static/` frontend bundle is baked into the image, and
# the frontend talks to the intear api directly from the browser (the
# backend is never rate limited by it).
#
# ACCESS: nothing is published to the host on purpose. the app is
# reachable only through the cloudflare tunnel over https, which is
# what makes wallet sign-in work (see the secure-context note at the
# bottom). to reach it another way while debugging, uncomment the
# `ports:` block on shit-1170-rex-engine-backend below.

name: shit-1170-rex-engine-fullstack-backend
volumes:
  # the sqlite db. named, so `docker compose down` keeps it and a
  # rebuild never touches it.
  #
  # the explicit `name:` pins the volume to one exact name on the host,
  # so the compose project can be renamed without touching the data.
  # NEVER delete it and never point this at a different name without
  # migrating the data first.
  shit-1170-rex-engine-vault:
    name: shit-1170-rex-engine-production-vault
services:
  shit-1170-rex-engine-backend:
    build:
      context: ..
      dockerfile: DOCKER/Dockerfile
    image: shit-1170-rex-engine/shit-1170-rex-engine:0.1.0
    container_name: shit-1170-rex-engine-fullstack-backend
    restart: unless-stopped

    # NO `ports:` here on purpose — the app is not published to the
    # host. cloudflared reaches it over the compose network by
    # container name (see the tunnel's route below), so port 54733
    # never touches the host's network stack.
    #
    # to debug locally over http, uncomment:
    # ports:
    #   - "54733:54733"

    environment:
      # 0.0.0.0 inside the container so the published/origin port is
      # reachable from the other containers on this network.
      SHIT_1170_HOST: "0.0.0.0"
      SHIT_1170_PORT: "54733"
      RUST_LOG: "shit_1170=info"

    # --- WHY --- the tunnel token comes from the repo-root .env
    # through env_file, and NOT through `${TUNNEL_TOKEN}` interpolation:
    # compose only auto-loads a .env sitting NEXT TO this compose file
    # (in DOCKER/), and it interpolates BEFORE the service's env_file is
    # read. so the interpolated form was empty. env_file hands the
    # repo-root .env to the container verbatim.
    env_file:
      - ../.env

    # the vault is a named volume so the db survives `docker compose
    # down` and is never touched by a rebuild. the path inside the
    # container matches the app's default (`${HOME}/.shit-1170-rex-engine/`),
    # so no env is needed for it.
    #
    # the volume is mounted at the FOLDER and not at the db file:
    # sqlite creates the db file itself, and it needs to create the WAL
    # and SHM files beside it.
    volumes:
      - shit-1170-rex-engine-vault:/home/shit-1170/.shit-1170-rex-engine

  # ----------------------------------------
  # cloudflare tunnel — the only way in.
  #
  # the token below authenticates cloudflared to your tunnel and
  # fetches its hostname/ingress config from Cloudflare, so the route
  # that points at this service is configured in the CLOUDFLARE
  # dashboard, not here. for that dashboard route's "Service URL",
  # use the container name and port:
  #
  #     http://shit-1170-rex-engine-fullstack-backend:54733
  #
  # (NOT localhost — cloudflared is a separate container and has its
  # own loopback that nothing else is listening on. the container
  # name resolves over the compose network's internal DNS.)
  # ----------------------------------------
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: shit-1170-rex-engine-cloudflared
    restart: unless-stopped
    # --- WHY the token comes from the environment, not `--token` ---
    # `command: ... --token ${CLOUDFLARE_TUNNEL_TOKEN}` looks natural
    # but breaks: compose only auto-loads a `.env` sitting NEXT TO this
    # compose file (in DOCKER/), and `${...}` is interpolated when
    # compose parses the file — before the service's env_file is read.
    # the result was an EMPTY token and a cloudflared container that
    # just printed its own help text.
    #
    # cloudflared reads $TUNNEL_TOKEN by itself, so `.env` defines the
    # variable under exactly that name and env_file hands it straight
    # through. no interpolation, so it works from any directory and
    # cannot half-configure.
    command: tunnel --no-autoupdate run
    env_file:
      # the repo-root `.env` (one level up from this file). it defines
      # TUNNEL_TOKEN, which is the name cloudflared looks for.
      - ../.env
    depends_on:
      - shit-1170-rex-engine-backend

# ========================================
# NOTE: wallet sign-in needs a SECURE CONTEXT.
#
# the reason: signing a login message uses WebCrypto Ed25519, and
# `crypto.subtle` is only exposed in a secure context. browsers
# treat https, http://localhost and http://127.0.0.1 as secure —
# nothing else. so `http://localhost:54733` signs in fine, while
# the same container reached by LAN ip, VPN ip or hostname over
# plain http fails with "Cannot read properties of undefined
# (reading 'generateKey')".
#
# the cloudflare tunnel in front of this stack is the fix: it
# terminates TLS at Cloudflare's edge and serves the app on a real
# https:// hostname, so the browser gets a secure context from any
# device, anywhere.
# ========================================
# ========================================
