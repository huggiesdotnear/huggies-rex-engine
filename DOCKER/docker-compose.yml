name: huggies-rex-engine
services:
  huggies-rex-engine:
    build:
      context: ..
      dockerfile: DOCKER/Dockerfile
    image: huggies-rex-engine
    container_name: huggies-rex-engine
    restart: unless-stopped
    ports:
      - "48080:48080"
    environment:
      HUGGIES_REX_BIND_ADDR: "0.0.0.0:48080"
      HOME: "/home/huggies-rex"
    volumes:
      - ${HOME}/.huggies-rex-vault:/home/huggies-rex/.huggies-rex-vault
